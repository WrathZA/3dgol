<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the page extend under a phone's rounded corners and
      home indicator, which is what the Structure wants — and, less obviously, it
      is what makes `env(safe-area-inset-*)` resolve to anything other than zero.
      The control layer reads those insets to keep itself clear of the indicator,
      so without this the panel's safe-area handling silently does nothing.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--
      "3D Game of Life" already names a well-known and completely different
      thing — Life on a three-dimensional lattice, 26 neighbours, rules like
      5766. Somebody arriving from a link with that expectation will misread
      what they are looking at, so the title carries the correction rather than
      leaving it to the description, which search results truncate and chat
      previews sometimes drop entirely.
    -->
    <title>3D Game of Life — the third dimension is time</title>
    <meta
      name="description"
      content="Conway's Game of Life with the time axis drawn — not a 3D cellular automaton. Each generation is laid down as a layer, so the structure you fly around is the pattern's own history."
    />

    <!--
      One canonical address, matching the apex-only route in wrangler.jsonc.
      The workers.dev fallback serves this same page, and without this tag a
      search engine finding both would have two URLs competing for one product.
    -->
    <link rel="canonical" href="https://goluniverse.cc/" />

    <!--
      The card a link draws in Slack, Discord, or a message.

      Absolute URLs, and that is the part which quietly breaks: a card is
      rendered by a crawler that has only the markup, so a root-relative
      `/og-image.png` resolves against nothing and the card arrives without an
      image. The image itself is a captured frame of a real run — see
      `e2e/og-capture.mjs`, which recaptures it — because a logo or a mockup
      would promise something the product does not do.

      Width and height are declared so the platform can reserve the large card
      before it has fetched the image; without them the first render of a link
      is often the small square one.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="3D Game of Life" />
    <meta property="og:url" content="https://goluniverse.cc/" />
    <meta
      property="og:title"
      content="3D Game of Life — the third dimension is time"
    />
    <meta
      property="og:description"
      content="Conway's Game of Life with the time axis drawn — not a 3D cellular automaton. Each generation is laid down as a layer, so the structure you fly around is the pattern's own history."
    />
    <meta property="og:image" content="https://goluniverse.cc/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A tall lattice of glowing cyan and blue cubes on a near-black background — sixty generations of Conway's Game of Life stacked one above the next, dissolving at the bottom as the oldest layers retire."
    />

    <!--
      X reads the Open Graph tags above for everything except the card size, so
      only the two it has no equivalent for are repeated here. Duplicating the
      title and description would create a second copy to keep in step, and the
      copy that drifts is always the one nobody is looking at.
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image:alt"
      content="A tall lattice of glowing cyan and blue cubes on a near-black background — sixty generations of Conway's Game of Life stacked one above the next, dissolving at the bottom as the oldest layers retire."
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0e14;
      }

      /*
       * The structure is the page. A block-level canvas at full viewport size
       * avoids the inline-element descender gap that would otherwise produce a
       * scrollbar and a sliver of background below the canvas.
       *
       * touch-action: none hands every gesture to the camera controls. Without
       * it the browser claims drags for scrolling and pinches for page zoom, and
       * touch navigation simply does not work — no matter what the controls
       * support. Safe here because the page has nothing to scroll.
       *
       * Height in dvh, not %. On a phone, 100% of the body is the *large*
       * viewport — the one measured with the browser toolbar collapsed — so a
       * percentage canvas runs underneath the toolbar and the bottom of the
       * structure is cut off until the Viewer happens to scroll it away. dvh
       * tracks what is actually visible, which is also what makes landscape
       * usable: the same rule fits both orientations without a second layout.
       */
      #viewport {
        display: block;
        width: 100%;
        height: 100dvh;
        touch-action: none;
      }

      /*
       * Stops the rubber-band overscroll that would otherwise bounce the whole
       * page when a drag reaches the edge of the canvas on iOS.
       */
      html,
      body {
        overscroll-behavior: none;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
