<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Game of Life</title>
    <meta
      name="description"
      content="Conway's Game of Life with the time axis drawn — each generation stacked as a layer."
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0e14;
      }

      /*
       * The structure is the page. A block-level canvas at full viewport size
       * avoids the inline-element descender gap that would otherwise produce a
       * scrollbar and a sliver of background below the canvas.
       */
      #viewport {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
