<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Game of Life</title>
    <meta
      name="description"
      content="Conway's Game of Life with the time axis drawn — each generation stacked as a layer."
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0e14;
      }

      /*
       * The structure is the page. A block-level canvas at full viewport size
       * avoids the inline-element descender gap that would otherwise produce a
       * scrollbar and a sliver of background below the canvas.
       *
       * touch-action: none hands every gesture to the camera controls. Without
       * it the browser claims drags for scrolling and pinches for page zoom, and
       * touch navigation simply does not work — no matter what the controls
       * support. Safe here because the page has nothing to scroll.
       *
       * Height in dvh, not %. On a phone, 100% of the body is the *large*
       * viewport — the one measured with the browser toolbar collapsed — so a
       * percentage canvas runs underneath the toolbar and the bottom of the
       * structure is cut off until the Viewer happens to scroll it away. dvh
       * tracks what is actually visible, which is also what makes landscape
       * usable: the same rule fits both orientations without a second layout.
       */
      #viewport {
        display: block;
        width: 100%;
        height: 100dvh;
        touch-action: none;
      }

      /*
       * Stops the rubber-band overscroll that would otherwise bounce the whole
       * page when a drag reaches the edge of the canvas on iOS.
       */
      html,
      body {
        overscroll-behavior: none;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
